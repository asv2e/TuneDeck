name: TuneDeck

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TuneDeck:
    type: application
    platform: iOS
    sources:
      - path: TuneDeck
      - path: Config
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tunedeck   # change me
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  TuneDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TuneDeckTests
    dependencies:
      - target: TuneDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tunedeck.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TuneDeck:
    build:
      targets:
        TuneDeck: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TuneDeckTests
    archive:
      config: Release
