name: iOS CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: >-
          xcodebuild test
          -project TuneDeck.xcodeproj
          -scheme TuneDeck
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive app
        run: >-
          xcodebuild archive
          -project TuneDeck.xcodeproj
          -scheme TuneDeck
          -destination 'generic/platform=iOS'
          -archivePath build/TuneDeck.xcarchive
          CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/TuneDeck.xcarchive/Products/Applications/TuneDeck.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload TuneDeck.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneDeck-${{ github.ref_name }}.ipa
          path: TuneDeck.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TuneDeck ${{ github.ref_name }}
          body: |
            Unsigned iOS IPA. It is provided for inspection and cannot be installed on iOS devices.
          files: TuneDeck.ipa
